<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>THREE.js</title>
    <script src='js/jquery.min.js'></script>
    <script src='js/three.min.js'></script>
    <script src="js/Detector.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/THREEx.WindowResize.js"></script>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id='container'></div>
  </body>
  <script type="module">
    import { createRipple } from './src/ripple.mjs';
    import { createStage, addSkybox, addOrbitControls } from './src/scene-setup.mjs';
    import { onClick } from './src/picking.mjs';
    import { createMirrorSphere } from './src/mirror-sphere.mjs';

    var $container = $('#container');
    var renderer;
    var camera;
    var scene;
    var controls;
    var targetList = [];
    var mirrorSphere, sphere;
    var radius = 50;
    var intersect;

    var sim;
    var res = 25;
    function initPositions() {
      sim = createRipple(res);
    }

    function ripple(intersect) {
      if (typeof intersect != "undefined") {
        var vertex = intersect.face.a;
        var x = vertex % res;
        var y = Math.floor(vertex / res);

        sim.disturb(x, y, 10);
      }
      sim.step();
    }

    function animate() {
      // this line contains the animation magic
      // and will call animate when the next frame is available
      // see http://mdn.io/window.requestAnimationFrame
      requestAnimationFrame(animate);

      camera.lookAt(scene.position);

      controls.update();

      render();
    }

    function render() {
      mirrorSphere.updateReflection(renderer, scene);
      renderer.render(scene, camera);
      ripple(intersect);
      mirrorSphere.displace(sim.height);
    }
    
    function init() {
      ({ renderer, scene, camera } = createStage($container));

      mirrorSphere = createMirrorSphere(scene, radius, res);
      sphere = mirrorSphere.mesh;

      targetList.push(sphere);

      var pointLight = new THREE.PointLight( 0xFFFFFF );

      pointLight.position.x = 10;
      pointLight.position.y = 50;
      pointLight.position.z = 130;

      scene.add(pointLight);

      scene.add(sphere);

      addSkybox(scene);

      // Set up mouse controls
      controls = addOrbitControls(camera, renderer);

      initPositions();

      // Set up for handling mouse cliques
      onClick(camera, targetList, function (hit) {
        intersect = hit;
      });
    }

    init();

    // Module variables aren't globals, so expose what the smoke tests (and the
    // devtools console) need to reach.
    window.demo = { renderer, scene, camera, sphere };

    animate();
  </script>
</html>
