<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>THREE.js</title>
    <script src='js/jquery.min.js'></script>
    <script src='js/three.min.js'></script>
    <script src="js/Detector.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/THREEx.WindowResize.js"></script>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id='container'></div>
  </body>
  <script type="module">
    import { createRipple } from './src/ripple.mjs';
    import { createStage, addSkybox, addOrbitControls } from './src/scene-setup.mjs';

    var $container = $('#container');
    var renderer;
    var camera;
    var scene;
    var controls;
    var projector;
    var mouse = { x: 0, y: 0 };
    var targetList = [];
    var sphere, sphereMirror;
    var radius = 50;
    var intersect;

    var sim;
    var res = 25;
    var separation = 25;
    function initPositions() {
      sim = createRipple(res);
    }

    function ripple(intersect) {
      if (typeof intersect != "undefined") {
        var vertex = intersect.face.a;
        var x = vertex % res;
        var y = Math.floor(vertex / res);

        sim.disturb(x, y, 10);
      }
      sim.step();
    }

    function updateVertices(geometry) {
      for (var i = 0, l = geometry.vertices.length; i < l; i++) {
        var vertex = geometry.vertices[i];
        var vec = new THREE.Vector3(vertex.x, vertex.y, vertex.z);
        vec.setLength(sim.height(i) + radius);
        vertex.x = vec.x;
        vertex.y = vec.y;
        vertex.z = vec.z;
      }
      geometry.verticesNeedUpdate = true;
    }



    function animate() {
      // this line contains the animation magic
      // and will call animate when the next frame is available
      // see http://mdn.io/window.requestAnimationFrame
      requestAnimationFrame(animate);

      camera.lookAt(scene.position);

      controls.update();

      render();
    }

    function render() {
      sphere.visible = false;
      sphereMirror.updateCubeMap(renderer, scene);
      sphere.visible = true;
      renderer.render(scene, camera);
      ripple(intersect);
      updateVertices(sphere.geometry);
    }
    
    function init() {
      ({ renderer, scene, camera } = createStage($container));

      sphereMirror = new THREE.CubeCamera(0.1, 5000, 512);
      scene.add(sphereMirror);
      var sphereMirrorMaterial = new THREE.MeshBasicMaterial({ envMap: sphereMirror.renderTarget });

      var segments = res, rings = res;
      sphere = new THREE.Mesh(
          new THREE.SphereGeometry(radius, segments, rings),
          sphereMirrorMaterial);
      sphereMirror.position.set(0, 0, 0);
      sphereMirror.position = sphere.position;

      targetList.push(sphere);

      var pointLight = new THREE.PointLight( 0xFFFFFF );

      pointLight.position.x = 10;
      pointLight.position.y = 50;
      pointLight.position.x = 130;

      scene.add(pointLight);

      scene.add(sphere);

      addSkybox(scene);

      // Set up mouse controls
      controls = addOrbitControls(camera, renderer, render);

      // Set up for handling mouse cliques
      projector = new THREE.Projector();

      initPositions();
      document.addEventListener('mousedown', onDocumentMouseDown, false);
    }

    /*
     * totally borrowed this from:
     * http://stemkoski.github.io/Three.js/Mouse-Click.html
     */
    function onDocumentMouseDown(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
      var vector = new THREE.Vector3(mouse.x, mouse.y, 1);
      projector.unprojectVector(vector, camera);
      var ray = new THREE.Raycaster(camera.position, vector.sub(camera.position).normalize());

      var intersections = ray.intersectObjects(targetList);
      if (intersections.length > 0) {
        intersect = intersections[0];
      }
    }
    
    init();

    // Module variables aren't globals, so expose what the smoke tests (and the
    // devtools console) need to reach.
    window.demo = { renderer, scene, camera, sphere };

    animate();
  </script>
</html>
