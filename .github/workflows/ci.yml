# Runs on both GitHub Actions and Gitea Actions (Gitea reads .github/workflows
# when there is no .gitea/workflows).
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The image ships the exact Chromium build the snapshots were recorded
    # with. Its tag must match @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Disable git://
        run: git config --global protocol.git.allow never

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run smoke tests
        run: npm test

      # Expected/actual/diff images for any snapshot mismatch.
      # actions/upload-artifact@v4 refuses to run outside github.com, so use
      # its Gitea-compatible fork, which also works on GitHub. Referenced via
      # its GitHub copy because GitHub doesn't accept URLs in `uses`; pinned
      # to a commit because its v4 is a branch.
      - name: Upload test results
        if: failure()
        uses: christopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
